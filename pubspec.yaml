name: assistant_mcp
description: MCP server for AI assistant - provides tools to manage tasks, projects, events, and daily plans.
version: 0.1.0
repository: https://github.com/your-org/assistant_mcp

environment:
  sdk: ^3.11.5

dependencies:
  path: ^1.9.0
  mcp_dart: ^2.4.1          # MCP SDK (Model Context Protocol)
  http: ^1.2.0              # HTTP client for backend API
  dotenv: ^4.2.0            # Environment configuration
  logging: ^1.3.0           # Structured logging (standard Dart package)

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
